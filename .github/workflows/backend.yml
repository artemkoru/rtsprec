name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Every check runs a Makefile target. Versions and package lists live in the Makefile.
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Install tools
        run: make tools

      - name: Lint
        run: make lint

  unit-test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Unit tests
        run: make test-unit

  build:
    runs-on: ubuntu-latest
    name: Build Binary
    needs: [ lint ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build
        run: make build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtsprec-binary
          path: rtsprec
          retention-days: 1

  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    needs: [ build, unit-test ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.0'

      - name: Integration tests
        run: make test-integration
