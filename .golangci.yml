version: "2"

run:
  tests: true

linters:
  enable:
    - staticcheck      # Catches bugs and suspicious constructs
    - errcheck         # Checks error returns
    - unused           # Detects unused variables
    - ineffassign      # Detects ineffective assignments
    - govet            # Go vet linter
  exclusions:
    paths:
      - vendor
      - internal/capture
    rules:
      - path: internal/capture
        linters:
          - all
      - path: .*_test\.go
        linters:
          - errcheck

output:
  formats:
    text:
      path: stdout
      colors: true
