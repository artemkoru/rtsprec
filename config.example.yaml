# RTSP Surveillance System Configuration

server:
  port: 8080
  host: "0.0.0.0"
  tls_cert: ""  # Optional: path to TLS certificate
  tls_key: ""   # Optional: path to TLS key

aws:
  region: "us-east-1"
  s3_bucket: "my-surveillance-bucket"
  s3_path_prefix: "surveillance"
  access_key_id: "YOUR_AWS_ACCESS_KEY"
  secret_access_key: "YOUR_AWS_SECRET_KEY"

auth:
  method: "basic"  # "oidc" or "basic"
  # For OIDC (Google, Yandex):
  oidc_provider: "google"  # "google" or "yandex"
  oidc_client_id: ""
  oidc_secret: ""
  # For Basic Auth:
  basic_username: "admin"
  basic_password: "changeme"

database:
  path: "/opt/rtsprec/data/rtsprec.db"

hls:
  segment_duration_seconds: 2
  segments_per_list: 5
  output_path: "/var/cache/rtsprec/hls"
