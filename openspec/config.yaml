schema: spec-driven

rules:
  proposal:
    - "Перед созданием файлов предложения проверь текущую ветку Git. Если ты находишься в main или master, обязательно создай и переключись на новую ветку формата feat/<change-name>."

operations:
  apply:
    - "Перед написанием кода убедись, что активна отдельная ветка feat/<change-name> (не main). Если её нет — создай её от main и переключись на неё."
