schema: spec-driven

context: |
  Проект: RTSP-система видеонаблюдения (rtsprec) на Go 1.26.0.
  Модуль: github.com/artemkoru/rtsprec. Фронтенд (React, Vite) лежит в web/ и на Go не влияет.

  Структура:
  - cmd/rtsprec — единственный бинарник. Только вызывает app.New(), app.Init(ctx), app.Run() и graceful shutdown через app.Shutdown.
  - internal/app — сборка приложения: загрузка конфига из переменных окружения (config.go), открытие БД, auth, S3, API, HLS, роуты (router.go), запуск захвата камер (cameras.go).
  - internal/api — HTTP-обработчики (APIServer, HLSHandler). Пути берутся через r.PathValue.
  - internal/auth — сессии, basic/OIDC, middleware. Логин и logout публичные, остальные роуты требуют токен.
  - internal/capture — RTSP-клиент на gortsplib v5 (pkg/format, pkg/base) и скриншоты.
  - internal/motion, internal/encoder, internal/hls — детекция движения, нарезка видео, HLS.
  - internal/archive, internal/db, internal/config — архив, SQLite, зашифрованное хранилище настроек.
  - internal/storage — S3-загрузка.

  Чистая архитектура (слои внутри internal/):
  - internal/domain — сущности и ошибки. Не импортирует другие внутренние пакеты. Внешние зависимости в домене недопустимы.
  - internal/repository — интерфейсы хранилищ (repository.go). Реализации: repository/sqlite и repository/s3. Реализации импортируют domain и не импортируют service.
  - internal/service — бизнес-логика. Зависит от domain и от интерфейсов repository. Не зависит от конкретных SQL или S3-реализаций.
  - Направление зависимостей: domain ← repository ← service. Обратных импортов быть не должно.
  - Известное отклонение: internal/api работает с db, archive и config напрямую и не использует internal/service. internal/service сейчас не импортируется приложением, и его тестируют только тесты в CI. Новый код, который должен попасть в продукт, по возможности идёт через service и repository. Не переписывай api на service без явной задачи.
  - Композиция (сборка зависимостей) — только в internal/app и cmd/rtsprec, не в domain, service или repository.

  Effective Go и идиомы Go:
  - Короткие имена для локальных переменных и ресиверов (a *App, r *Reader), длинные для экспортируемых. Имена пакетов — короткие, в нижнем регистре, без подчёркиваний и множественного числа.
  - Экспортируемые идентификаторы имеют doc-комментарий, начинающийся с их имени.
  - Принимай интерфейсы, возвращай конкретные типы. Интерфейсы объявляй там, где они используются, и держи их маленькими.
  - Контекст (context.Context) — первым параметром. Не храни контекст в структурах, кроме случаев, когда жизненный цикл фоновой работы явно связан с App.
  - Ошибки: sentinel-ошибки и errors.Is / errors.As там, где вызывающий код их различает; иначе fmt.Errorf("...: %w"). Не паникуй в обычном коде, паника только для невозможных состояний.
  - Горутины всегда имеют понятный способ остановки: закрытие канала, отмена контекста или возврат ошибки. Запуск горутины без механизма остановки не допускается.
  - defer для освобождения ресурсов сразу после получения. Ошибку из Close проверяй или логируй.
  - Не используй init() для сборки состояния; зависимости передаются явно.
  - Таблично-ориентированные тесты (t.Run) для наборов входов.

  Конвенции проекта:
  - Конфигурация только из переменных окружения; новые переменные добавляются в Config и LoadConfig и описываются в docs/deployment.md.
  - Ошибки не игнорируются: логируются или возвращаются (errcheck включён).
  - Внешние зависимости (S3, RTSP) подменяются полями структур, чтобы тесты не ходили в сеть. Пример: App.newS3Uploader, storage.NewS3UploaderWithoutCheck.
  - Тесты: стандартный testing и net/http/httptest, без внешних сервисов. Для хранилищ используется временный каталог (t.TempDir).
  - Форматирование: gofmt. Линтер: golangci-lint v2 (версия v2.15.0, конфиг .golangci.yml), запуск через make lint.

  Команды проверки:
  - make test-unit — юнит-тесты пакетов из CI (domain, repository, service, app).
  - make lint — go vet и golangci-lint на тех же пакетах.
  - go build ./cmd/rtsprec — сборка бинарника; должна проходить (CI падает при ошибке сборки).

  CI: .github/workflows/backend.yml (lint, unit-test, build, integration-test) и frontend.yml. Workflow запускаются при push и PR в main.

  Требование к линтерам и тестам:
  - Локальный запуск линтеров и тестов и запуск в CI должны быть идентичны: одна и та же команда, одни и те же пакеты, одна и та же версия инструментов.
  - Все проверки запускаются через Makefile-цели: make tools (установка закреплённой версии golangci-lint), make fmt-check, make vet, make lint (fmt-check + vet + golangci-lint), make test-unit, make test-integration, make build. Шаги CI вызывают эти цели, а не go vet, golangci-lint или go test напрямую.
  - Список пакетов и версия golangci-lint задаются только в Makefile (переменные) и .golangci.yml. Не дублируй их в workflow.
  - Если проверка есть в CI, её поведение должно быть и у make-цели, и наоборот. Например, проверка gofmt входит в make lint через цель make fmt-check.

rules:
  proposal:
    - "Перед созданием файлов предложения проверь текущую ветку Git. Если ты находишься в main или master, обязательно создай и переключись на новую ветку формата feat/<change-name>."
    - "Для Go-изменений перечисли затронутые пакеты (cmd/…, internal/…) и укажи, меняется ли публичное поведение HTTP API или конфигурации."
    - "Если изменение касается бизнес-логики, укажи слой (domain, repository, service или app) и не предлагай импорт из внешнего слоя во внутренний."
  design:
    - "Для Go-изменений опиши, какие пакеты создаются, меняются или удаляются, и кто от кого зависит. Соблюдай направление domain ← repository ← service; не добавляй импорты из cmd/ и internal/app в другие пакеты."
    - "Если добавляется интерфейс, объясни, где он объявлен и какие реализации будут. Не добавляй интерфейс с одной реализацией без причины, например для тестов."
    - "Если меняется конфигурация, опиши новые переменные окружения: имя, значение по умолчанию и поведение при некорректном значении."
  specs:
    - "Требования к HTTP API формулируй как наблюдаемое поведение: метод и путь, код ответа, формат JSON, поведение без токена."
  tasks:
    - "Каждая задача с Go-кодом заканчивается проверяемой командой, например go test ./internal/<pkg>/ -run <Name> или go build ./cmd/rtsprec."
    - "Группа задач, меняющая Go-код, включает тесты в той же группе, а не в конце. Перед закрытием группы — gofmt -l, go vet и make lint на затронутых пакетах."
    - "Задача, которая добавляет логику в service или repository, включает тест с фейковой реализацией интерфейса repository."
    - "Задача, которая меняет CI или проверки, вызывает make-цели вместо прямых команд go и golangci-lint и проверяет, что make-цель даёт тот же результат локально."

operations:
  apply:
    guidance:
      - "Перед написанием кода убедись, что активна отдельная ветка feat/<change-name> (не main). Если её нет — создай её от main и переключись на неё."
      - "Перед тем как отметить Go-задачу выполненной, запусти gofmt -l, go vet и соответствующие go test на затронутых пакетах. Не отмечай задачу, если проверка падает."
      - "Не меняй .golangci.yml, версию линтера в CI и Makefile без явного запроса: версия закреплена (v2.15.0)."
      - "Не переноси internal/api на internal/service в рамках задач, которые этого не требуют: это отдельное решение."
